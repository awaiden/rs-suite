      always() &&
      needs.build-rsdu.result != 'failure' &&
      needs.build-rsfind.result != 'failure' &&
      needs.build-rsgrep.result != 'failure' &&
      needs.build-rstop.result != 'failure' &&
      needs.build-rsnet.result != 'failure' &&
      needs.build-rssock.result != 'failure' &&
      needs.build-rsfetch.result != 'failure' &&
      needs.build-rslog.result != 'failure' &&
      needs.build-rssvc.result != 'failure' &&
      (needs.build-rsdu.result == 'success' || needs.build-rsfind.result == 'success' || needs.build-rsgrep.result == 'success' || needs.build-rstop.result == 'success' || needs.build-rsnet.result == 'success' || needs.build-rssock.result == 'success' || needs.build-rsfetch.result == 'success' || needs.build-rslog.result == 'success' || needs.build-rssvc.result == 'success')
