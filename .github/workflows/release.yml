name: Release

on:
  push:
    tags:
      - "v*"
      - "rsdu-v*"
      - "rstop-v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-rsdu:
    name: Build rsdu (${{ matrix.target }})
    if: startsWith(github.ref_name, 'rsdu-v') || startsWith(github.ref_name, 'v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: rsdu-${{ matrix.target }}

      - name: Build release binary
        run: cargo build -p rsdu --release --locked --target ${{ matrix.target }}

      - name: Package archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          name="rsdu-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$name"
          cp "target/${{ matrix.target }}/release/rsdu" crates/rsdu/LICENSE crates/rsdu/README.md "$name/"
          tar czf "$name.tar.gz" "$name"
          (shasum -a 256 "$name.tar.gz" || sha256sum "$name.tar.gz") > "$name.tar.gz.sha256"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rsdu-${{ matrix.target }}
          path: |
            rsdu-*.tar.gz
            rsdu-*.tar.gz.sha256

  build-rstop:
    name: Build rstop (${{ matrix.target }})
    if: startsWith(github.ref_name, 'rstop-v') || startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            apt_pkg: ""
            linker_env: ""
          - target: x86_64-unknown-linux-musl
            apt_pkg: musl-tools
            linker_env: ""
          - target: aarch64-unknown-linux-gnu
            apt_pkg: gcc-aarch64-linux-gnu libc6-dev-arm64-cross
            linker_env: aarch64-linux-gnu-gcc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: rstop-${{ matrix.target }}

      - name: Install target system tools
        if: matrix.apt_pkg != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.apt_pkg }}

      - name: Run tests (native target)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo test -p rstop --locked

      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker_env }}
        run: cargo build -p rstop --release --locked --target ${{ matrix.target }}

      - name: Package archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          name="rstop-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$name"
          cp "target/${{ matrix.target }}/release/rstop" crates/rstop/LICENSE crates/rstop/README.md "$name/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rstop-${{ matrix.target }}
          path: |
            rstop-*.tar.gz
            rstop-*.tar.gz.sha256

  release:
    name: Publish GitHub Release
    permissions:
      contents: write
    needs: [build-rsdu, build-rstop]
    if: |
      always() &&
      needs.build-rsdu.result != 'failure' &&
      needs.build-rstop.result != 'failure' &&
      (needs.build-rsdu.result == 'success' || needs.build-rstop.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
