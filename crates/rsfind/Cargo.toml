[package]
name = "rsfind"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Fast parallel file finder with interactive fuzzy TUI, combining fd and fzf"
license.workspace = true
repository = "https://github.com/awaiden/rs-suite"
readme = "README.md"
keywords = ["find", "fd", "fzf", "fuzzy", "tui"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
clap.workspace = true
crossterm.workspace = true
globset = "0.4"
ignore = "0.4"
nucleo-matcher = "0.3"
ratatui.workspace = true
rayon.workspace = true
regex.workspace = true
rs-common.workspace = true
rustix.workspace = true

[dev-dependencies]
tempfile = "3"
