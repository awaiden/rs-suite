[workspace]
resolver = "2"
members = [
    "crates/rs-common",
    "crates/rsdu",
    "crates/rsfetch",
    "crates/rsfind",
    "crates/rsgrep",
    "crates/rslog",
    "crates/rsnet",
    "crates/rssock",
    "crates/rssvc",
    "crates/rstop",
]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ratatui = "0.30.2"
crossterm = "0.29"
ignore = "0.4"
libc = "0.2"
rayon = "1.12.0"
regex = "1.13.1"
rustix = { version = "1.1.6", features = ["fs", "process"] }
serde_json = "1.0.154"
rs-common = { path = "crates/rs-common" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
